# Publishes Revenge Classic (Vendetta API) builds to `classic/<plugin>/` on the pool branch.
# Revenge Classic installs a plugin from a URL serving `manifest.json` and `index.js`.

name: Publish Classic builds

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Build Classic plugins
        run: bun run build:classic

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Publish Classic builds
        run: .github/scripts/publish-classic.sh
